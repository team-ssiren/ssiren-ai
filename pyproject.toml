[project]
name = "ssairen-ai"
version = "0.1.0"
description = "싸이렌 AI 서버 — FastAPI stateless AI compute server (BE→AI internal)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.55",
    "python-multipart>=0.0.12",
    "sentence-transformers>=3.0",
    "torch>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.7",
]

# Application project (not a distributable package): install deps only.
[tool.uv]
package = false

# PyTorch CUDA (cu128) wheels for GPU (RTX 3090). Windows-targeted dev.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI dependency markers are call-in-default by design.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Depends",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
