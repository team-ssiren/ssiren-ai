[project]
name = "ssairen-ai"
version = "0.1.0"
description = "싸이렌 AI 서버 — FastAPI stateless AI compute server (BE→AI internal)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.55",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.7",
    "openpyxl>=3.1",
]

# Application project (not a distributable package): install deps only.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI dependency markers are call-in-default by design.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Depends",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
